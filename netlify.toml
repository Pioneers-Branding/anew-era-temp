# Netlify build configuration
# The site is PHP templates rendered to static HTML at build time — Netlify
# serves the result from dist/. No PHP runs in production.

[build]
  # Tailwind first (assets/css/tailwind.css), then render the pages into dist/.
  command = "npm ci && npm run build:css && php build.php"
  publish = "dist"

[build.environment]
  # Netlify's Ubuntu 24.04 image offers PHP 7.4 – 8.3; the templates need 8.0+.
  PHP_VERSION  = "8.3"
  NODE_VERSION = "20"

# Hashed/versioned assets can be cached hard; the ?v= query on each URL changes
# whenever the file does, so a stale copy is never served.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Contact page pretty URL.
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Form submission confirmation page.
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200
